name: skills-tests
on:
  push:
    paths: ["src/webwright/skills/**", "src/webwright/tools/skill_use.py", "tests/skills/**"]
  pull_request:
    paths: ["src/webwright/skills/**", "src/webwright/tools/skill_use.py", "tests/skills/**"]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx pyyaml jinja2 pydantic
      - name: skills unit tests (LLM-free)
        run: |
          set -e
          for t in tests/skills/test_*.py; do
            echo "== $t"; PYTHONPATH=src python "$t"
          done
      - name: wrapper usage check (F6)
        run: |
          set +e
          bash src/webwright/skills/examples/solve_with_library.sh > /dev/null 2>&1
          [ $? -eq 1 ] && echo "usage-exit OK" || { echo "wrapper must exit 1 on missing args"; exit 1; }
